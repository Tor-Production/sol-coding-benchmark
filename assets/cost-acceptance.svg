<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 610">
<title id="title">API-equivalent cost versus accepted delivery rate</title>
<desc id="desc">Supplementary reliability chart. X is frozen API-equivalent dollars per attempt; y is accepted deliveries divided by twelve attempts, expressed as a percentage. Accepted delivery requires completed status and an accepted main grade. The y axis is explicitly zoomed to 80–100 percent with headroom. Sol 6 Max and Ultra costs are lower bounds, shown with rightward arrows.</desc>
