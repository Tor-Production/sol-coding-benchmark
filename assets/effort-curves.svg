<text x="70" y="571" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#53667B">The quality detail uses the same 90–100 scale for each model; the primary cost-quality figure also shows the full 0–100 scale.</text>
<text x="70" y="591" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#53667B">Cost arrows point upward here because dollars are on the vertical axis. Two Sol 6 settings have incomplete totals.</text>
<text x="70" y="609" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#53667B">These descriptive averages do not show a smooth scaling law or establish that additional effort always improves code.</text>
