<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 850">
<title id="title">The cost of better MVCC tests</title>
<desc id="desc">X is frozen API-equivalent dollars per MVCC attempt. Y is the percentage of six fixed injected defects detected by candidate-written tests. The scale is zero to one hundred. Hollow points show both actual repetitions; filled effort shapes and connected lines show pair means only when both scores are available. Sol 6 Max has one usable score of two and no pair mean. No-added-tests observations have explicit numerical zero sensitivity.</desc>
